<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Skeleton — OneMode</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="../../src/css/onemode.css"
    >
</head>

<body>

<main class="om-page">

    <header class="om-page-header">
        <div>
            <h1 class="om-page-title">Skeleton</h1>
            <p class="om-page-description">
                Loading placeholders for content that has not loaded yet.
            </p>
        </div>
    </header>

    <!-- Basic shapes -->
    <section class="om-page-section">
        <h2 class="om-page-section-title">Basic Shapes</h2>

        <div class="om-skeleton-stack">

            <div
                class="om-skeleton om-skeleton-heading"
                aria-hidden="true"
            ></div>

            <div
                class="om-skeleton om-skeleton-text"
                aria-hidden="true"
            ></div>

            <div
                class="om-skeleton om-skeleton-text om-skeleton-text-short"
                aria-hidden="true"
            ></div>

            <div
                class="om-skeleton om-skeleton-button"
                aria-hidden="true"
            ></div>

            <div
                class="om-skeleton om-skeleton-block"
                aria-hidden="true"
            ></div>

        </div>
    </section>

    <!-- Profile/card -->
    <section class="om-page-section">
        <h2 class="om-page-section-title">Card Loading</h2>

        <div class="om-skeleton-card">
            <div
                class="om-skeleton om-skeleton-avatar"
                aria-hidden="true"
            ></div>

            <div class="om-skeleton-card-content">
                <div
                    class="om-skeleton om-skeleton-heading"
                    aria-hidden="true"
                ></div>

                <div
                    class="om-skeleton om-skeleton-text"
                    aria-hidden="true"
                ></div>

                <div
                    class="om-skeleton om-skeleton-text om-skeleton-text-short"
                    aria-hidden="true"
                ></div>
            </div>
        </div>
    </section>

    <!-- Student profile example -->
    <section class="om-page-section">
        <h2 class="om-page-section-title">
            Student Profile Loading
        </h2>

        <div class="om-card">
            <div class="om-skeleton-row">

                <div
                    class="om-skeleton om-skeleton-avatar-lg"
                    aria-hidden="true"
                ></div>

                <div class="om-skeleton-card-content">

                    <div
                        class="om-skeleton om-skeleton-heading"
                        aria-hidden="true"
                    ></div>

                    <div
                        class="om-skeleton om-skeleton-text om-skeleton-text-medium"
                        aria-hidden="true"
                    ></div>

                    <div
                        class="om-skeleton om-skeleton-text om-skeleton-text-short"
                        aria-hidden="true"
                    ></div>

                </div>

            </div>
        </div>
    </section>

    <!-- Table -->
    <section class="om-page-section">
        <h2 class="om-page-section-title">
            Table Loading
        </h2>

        <div class="om-card">
            <div
                class="om-skeleton-table"
                aria-hidden="true"
            >

                <div class="om-skeleton-table-row">
                    <div class="om-skeleton om-skeleton-text"></div>
                    <div class="om-skeleton om-skeleton-text"></div>
                    <div class="om-skeleton om-skeleton-text"></div>
                    <div class="om-skeleton om-skeleton-text"></div>
                </div>

                <div class="om-skeleton-table-row">
                    <div class="om-skeleton om-skeleton-text"></div>
                    <div class="om-skeleton om-skeleton-text"></div>
                    <div class="om-skeleton om-skeleton-text"></div>
                    <div class="om-skeleton om-skeleton-text"></div>
                </div>

                <div class="om-skeleton-table-row">
                    <div class="om-skeleton om-skeleton-text"></div>
                    <div class="om-skeleton om-skeleton-text"></div>
                    <div class="om-skeleton om-skeleton-text"></div>
                    <div class="om-skeleton om-skeleton-text"></div>
                </div>

                <div class="om-skeleton-table-row">
                    <div class="om-skeleton om-skeleton-text"></div>
                    <div class="om-skeleton om-skeleton-text"></div>
                    <div class="om-skeleton om-skeleton-text"></div>
                    <div class="om-skeleton om-skeleton-text"></div>
                </div>

            </div>
        </div>
    </section>

    <!-- Static -->
    <section class="om-page-section">
        <h2 class="om-page-section-title">
            Static Skeleton
        </h2>

        <div
            class="om-skeleton om-skeleton-block om-skeleton-static"
            aria-hidden="true"
        ></div>
    </section>

</main>

</body>
</html>
